<script>
  window.onload = function loadStudents() {
    populateSelect();
  };

  async function submitform() {
    console.log("Hello it workss!!!");
    debugger
    let a = document.getElementById("students");
    let sendingObj = {
      studentID: document.getElementById("students").value,
      exeID: document.getElementById("exercise").value,
      status: document.getElementById("status").value,
      feedback: document.getElementById("feedback").value
    };
    let testjson = JSON.stringify(sendingObj);
    debugger;
    const response = await fetch("http://localhost:8080/tracker/save", {
      method: "POST",
      body: testjson, // string or object
      headers: {
        "Content-Type": "application/json",
      },
    });
    if(response.status==404)
    {
      console.log("This Record already exists");
    }
    else{
      console.log("Student Added Successfully");
    }
  }

  async function populateSelect() {
    try {
      const response = await fetch("http://localhost:8080/student/getAll", {
        method: "GET",
        headers: {
          "Content-Type": "application/json",
        },
      });
      const exeResponse = await fetch("http://localhost:8080/exercise/getAll", {
        method: "GET",
        headers: {
          "Content-Type": "application/json",
        },
      });
      if (!response.ok) throw new Error("Network response was not ok");
      if (!exeResponse.ok) throw new Error("Network response was not ok");

      const studentsData = await response.json();
      debugger;
      const optionsElement = document.getElementById("students");

      studentsData.forEach((student) => {
        const option = document.createElement("option");
        option.value = student.id;
        option.textContent = student.username;
        optionsElement.appendChild(option);
      });

      const exerciseData = await exeResponse.json();
      debugger;
      const exeOptions = document.getElementById("exercise");

      exerciseData.forEach((exercise) => {
        const option = document.createElement("option");
        option.value = exercise.id;
        option.textContent = exercise.title;
        exeOptions.appendChild(option);
      });
    } catch (error) {
      console.error("Error fetching JSON:", error);
    }
  }
</script>
